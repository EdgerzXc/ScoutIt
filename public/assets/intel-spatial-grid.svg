<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="spatialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a" />
      <stop offset="50%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <radialGradient id="transitAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E8AE3C" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#6E531A" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#spatialBg)" />
  <rect width="1200" height="800" fill="url(#transitAura)" />

  <!-- Topographic Elevation Contours -->
  <path d="M -50,600 Q 250,550 500,620 T 1000,580 T 1250,640" fill="none" stroke="#222228" stroke-width="1.5" />
  <path d="M -50,520 Q 250,470 500,540 T 1000,500 T 1250,560" fill="none" stroke="#2a2a32" stroke-width="1.5" />
  <path d="M -50,440 Q 250,390 500,460 T 1000,420 T 1250,480" fill="none" stroke="#6E531A" stroke-width="1" stroke-opacity="0.4" />
  <path d="M -50,360 Q 250,310 500,380 T 1000,340 T 1250,400" fill="none" stroke="#E8AE3C" stroke-width="1" stroke-opacity="0.35" />
  <path d="M -50,280 Q 250,230 500,300 T 1000,260 T 1250,320" fill="none" stroke="#F7C64E" stroke-width="1.2" stroke-opacity="0.5" />
  <path d="M -50,200 Q 250,150 500,220 T 1000,180 T 1250,240" fill="none" stroke="#6E531A" stroke-width="1" stroke-opacity="0.3" />

  <!-- High-Speed Transit Arterial Vectors -->
  <path d="M 120,750 L 380,480 L 720,380 L 1080,120" fill="none" stroke="#E8AE3C" stroke-width="2.5" stroke-opacity="0.75" />
  <path d="M 80,680 L 340,410 L 680,310 L 1040,50" fill="none" stroke="#F7C64E" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="8,6" />

  <!-- Station / Node Beacons -->
  <g fill="#0c0e12" stroke="#F7C64E" stroke-width="2">
    <circle cx="380" cy="480" r="8" />
    <circle cx="720" cy="380" r="8" />
    <circle cx="1080" cy="120" r="8" />
  </g>
  <g fill="#F7C64E">
    <circle cx="380" cy="480" r="3" />
    <circle cx="720" cy="380" r="3" />
    <circle cx="1080" cy="120" r="3" />
  </g>
  <circle cx="720" cy="380" r="22" fill="#E8AE3C" fill-opacity="0.15" />
  <circle cx="720" cy="380" r="36" fill="none" stroke="#E8AE3C" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4,4" />

  <!-- Station Callouts -->
  <g font-family="monospace" font-size="10" fill="#E8AE3C" letter-spacing="1">
    <text x="395" y="475">KALAYAAN SUBWAY PORTAL [CP104]</text>
    <text x="735" y="375">BGC CENTRAL MULTIMODAL HUB</text>
    <text x="960" y="145">AYALA CBD INTERCHANGE</text>
  </g>

  <!-- Telemetry HUD -->
  <g font-family="monospace" font-size="11" fill="#E8AE3C" fill-opacity="0.65" letter-spacing="2">
    <text x="70" y="80">SPATIAL RADAR // TRANSIT ARTERY ALIGNMENT</text>
    <text x="70" y="105" fill="#888892">SCALE: 1:25,000 · SUBTERRANEAN DRIFT 0.00%</text>
    <text x="70" y="730">PASSENGER THROUGHPUT CAPACITY: 512,000 / DAY</text>
  </g>
</svg>
