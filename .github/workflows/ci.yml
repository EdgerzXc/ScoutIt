name: CI

# Safety net: runs on every push and pull request. Checks the code lints, tests
# pass, and the app still builds — BEFORE anything reaches the live site.
# This workflow never deploys and holds no real secrets (build uses placeholders).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

# Cancel older runs on the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Owner-approved surface locks
        run: npm run verify:surfaces

      - name: Lint
        run: npm run lint
      - name: Typography regression audit
        run: npm run audit:typography


      - name: Unit tests (Vitest)
        run: npm run test:unit

      # Mission Control ships from this repository and has its own suite. Tests
      # nobody runs are a plan, not a safety net.
      - name: Install Mission Control dependencies
        run: npm ci --prefix mission-control
      - name: Mission Control tests
        run: npm --prefix mission-control run test:security
      - name: Browser suite discovery
        run: npm run test:e2e:list


      - name: Build check
        # Placeholder env so `next build` doesn't fail on missing vars.
        # These are NOT real credentials — they only let the build compile.
        # Real values live in Vercel, never here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: "pk.placeholder"
          NEXT_PUBLIC_SITE_URL: "https://scout-it.vercel.app"
          AIRTABLE_API_KEY: "placeholder"
          AIRTABLE_BASE_ID: "appPlaceholder"
        run: npm run build

  required-ci-result:
    name: Required CI result
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Surface failed or cancelled verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "::error::ScoutIt verification ended with: $VERIFY_RESULT"
            exit 1
          fi
